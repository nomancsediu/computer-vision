[book]
title = "কম্পিউটার ভিশন — বাংলা টিউটোরিয়াল"
authors = ["Inception BD"]
description = "OpenCV, CNN, Transfer Learning এবং Deployment সহ কম্পিউটার ভিশন এর সম্পূর্ণ বাংলা গাইড"
language = "bn"
multilingual = false
src = "src"

[build]
build-dir = "book"

[output.html]
default-theme = "navy"
git-repository-url = "https://github.com/inceptionbd/Computer-Vision"
edit-url-template = "https://github.com/inceptionbd/Computer-Vision/edit/main/{path}"

[output.html.print]
enable = true
